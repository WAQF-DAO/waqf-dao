    <rect x="-56" y="-56" width="112" height="112" rx="10" fill="#081713" fill-opacity="0.7" stroke="url(#wpairGold)" stroke-width="3.5" transform="rotate(45)"/>
    <!-- Clean Water Droplet + Solar Halo -->
    <path d="M 0 -36 C 18 -14 28 2 28 16 C 28 31 15 42 0 42 C -15 42 -28 31 -28 16 C -28 2 -18 -14 0 -36 Z"
