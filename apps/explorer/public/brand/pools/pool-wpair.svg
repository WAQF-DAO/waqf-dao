  </defs>
  <rect x="6" y="6" width="348" height="348" rx="34" fill="url(#wpairBg)" stroke="url(#wpairGold)" stroke-width="2.5" stroke-opacity="0.55"/>
  <text x="26" y="38" fill="#A6BAB3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">GENESIS POOL 03</text>
  <rect x="252" y="21" width="84" height="24" rx="12" fill="#108458" fill-opacity="0.22" stroke="#1EB980" stroke-opacity="0.5"/>
  <text x="294" y="37" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">QIYAM</text>

  <g transform="translate(180, 146)">
