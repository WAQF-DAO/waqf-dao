<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="pool-wpair-title">
  <title id="pool-wpair-title">WPAIR — Clean Water Infrastructure Pool Emblem</title>
  <defs>
