<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="waqf-dao-mark-title">
  <title id="waqf-dao-mark-title">WAQF DAO — Medina Hisbah Vault Seal</title>
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#13342B"/>
      <stop offset="55%" stop-color="#0A1B16"/>
      <stop offset="100%" stop-color="#06110E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D993"/>
      <stop offset="45%" stop-color="#D4A84F"/>
      <stop offset="100%" stop-color="#9B7222"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECC774" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B68A32" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="emeraldStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48E5A8"/>
      <stop offset="50%" stop-color="#1EB980"/>
      <stop offset="100%" stop-color="#0D6E49"/>
    </linearGradient>
    <linearGradient id="sinkingStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A84F"/>
      <stop offset="100%" stop-color="#108458"/>
    </linearGradient>
    <radialGradient id="vaultGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#1EB980" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#108458" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06110E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.45"/>
  <rect x="30" y="30" width="452" height="452" rx="94" fill="none" stroke="#1EB980" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Subtle Vault Ambient Glow -->
  <circle cx="256" cy="256" r="176" fill="url(#vaultGlow)"/>

  <!-- Outer Rub el Hizb (8-Pointed Seal: Axis-Aligned + 45-deg Interlocked Squares) -->
  <g stroke="url(#goldGrad)" stroke-linejoin="round">
    <rect x="124" y="124" width="264" height="264" rx="14" fill="#081713" fill-opacity="0.72" stroke-width="7"/>
    <rect x="124" y="124" width="264" height="264" rx="14" fill="#081713" fill-opacity="0.65" stroke-width="7" transform="rotate(45 256 256)"/>
    <!-- Inner Geometric Hairline -->
    <rect x="142" y="142" width="228" height="228" rx="10" fill="none" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="142" y="142" width="228" height="228" rx="10" fill="none" stroke-width="1.5" stroke-opacity="0.45" transform="rotate(45 256 256)"/>
  </g>

  <!-- 8 Rub el Hizb Vertex Anchor Nodes -->
  <g fill="#ECC774">
    <circle cx="256" cy="69" r="5"/>
    <circle cx="388" cy="124" r="5"/>
    <circle cx="443" cy="256" r="5"/>
    <circle cx="388" cy="388" r="5"/>
    <circle cx="256" cy="443" r="5"/>
    <circle cx="124" cy="388" r="5"/>
    <circle cx="69" cy="256" r="5"/>
    <circle cx="124" cy="124" r="5"/>
  </g>

  <!-- Inner Pointed Medina Mihrab Arch (Ownerless Principal Sanctuary) -->
  <path d="M 184 358 L 184 256 C 184 204 218 173 256 146 C 294 173 328 204 328 256 L 328 358 Z"
        fill="#050F0C" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linejoin="round"/>
  <path d="M 196 348 L 196 258 C 196 213 224 185 256 161 C 288 185 316 213 316 258 L 316 348"
        fill="none" stroke="#1EB980" stroke-width="1.75" stroke-opacity="0.35"/>

  <!-- Merkle Root Keystone (0x01 Domain-Separated Diamond) -->
  <path d="M 256 178 L 286 208 L 256 238 L 226 208 Z" fill="url(#goldGrad)"/>
  <path d="M 256 190 L 274 208 L 256 226 L 238 208 Z" fill="url(#emeraldStream)"/>
  <circle cx="256" cy="208" r="4.5" fill="#FAF7F0"/>

  <!-- 3-Channel PSAK 412 Waterfall (Sinking Fund | Mauquf 'Alaih | Nazhir <=10%) -->
  <!-- Left: 40% Sinking Fund -->
  <path d="M 241 240 C 223 252 216 266 216 286 L 216 340"
        fill="none" stroke="url(#sinkingStream)" stroke-width="11" stroke-linecap="round"/>
  <!-- Center: 50.5% Mauquf 'Alaih Primary Usufruct Stream -->
  <line x1="256" y1="246" x2="256" y2="342"
        stroke="url(#emeraldStream)" stroke-width="14" stroke-linecap="round"/>
  <!-- Right: <=10% Statutory Nazhir Governance Cap -->
  <path d="M 271 240 C 289 252 296 266 296 286 L 296 340"
        fill="none" stroke="url(#goldSoft)" stroke-width="11" stroke-linecap="round"/>

  <!-- Zero-Diff Ledger Plinth Bars -->
  <line x1="170" y1="358" x2="342" y2="358" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="204" y1="374" x2="308" y2="374" stroke="#1EB980" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
