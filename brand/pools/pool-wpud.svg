    <path d="M -32 29 Q -16 17 0 29 T 32 29" fill="none" stroke="#ECC774" stroke-width="3.8" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M -22 -4 C -22 -24 -4 -36 16 -32 C 26 -30 32 -20 26 -10 C 20 -2 8 -6 4 -16 C 14 -18 16 -24 6 -24 C -6 -24 -12 -14 -12 -4 Z"
