  <rect x="6" y="6" width="348" height="348" rx="34" fill="url(#wpudBg)" stroke="url(#wpudGold)" stroke-width="2.5" stroke-opacity="0.55"/>
  <text x="26" y="38" fill="#A6BAB3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">GENESIS POOL 01</text>
  <rect x="228" y="21" width="108" height="24" rx="12" fill="#D4A84F" fill-opacity="0.16" stroke="#D4A84F" stroke-opacity="0.45"/>
  <text x="282" y="37" text-anchor="middle" fill="#ECC774" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">QIYAM &amp; FAHS</text>

