    <rect x="-56" y="-56" width="112" height="112" rx="10" fill="#081713" fill-opacity="0.7" stroke="url(#wpudGold)" stroke-width="3.5" transform="rotate(45)"/>
    <!-- Stylized Vannamei Aquaculture Wave & Coastal Aerator Rings -->
